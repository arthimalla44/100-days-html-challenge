<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animated Contact Page</title>

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#020617;
      overflow-x:hidden;
      color:white;
    }

    /* MAIN SECTION */

    .contact-section{
      width:100%;
      min-height:100vh;
      position:relative;
      overflow:hidden;
      padding:100px 8%;
      background:
      linear-gradient(to right,#020617,#0f172a,#1e3a8a);
    }

    /* GLOW EFFECT */

    .glow{
      position:absolute;
      width:500px;
      height:500px;
      border-radius:50%;
      filter:blur(150px);
      opacity:0.2;
    }

    .glow1{
      background:#38bdf8;
      top:-100px;
      left:-100px;
      animation:move1 8s infinite alternate;
    }

    .glow2{
      background:#7c3aed;
      bottom:-100px;
      right:-100px;
      animation:move2 10s infinite alternate;
    }

    @keyframes move1{

      0%{
        transform:translate(0,0);
      }

      100%{
        transform:translate(90px,40px);
      }
    }

    @keyframes move2{

      0%{
        transform:translate(0,0);
      }

      100%{
        transform:translate(-80px,-40px);
      }
    }

    /* PARTICLES */

    .particles span{
      position:absolute;
      width:4px;
      height:4px;
      background:#38bdf8;
      border-radius:50%;
      box-shadow:0 0 15px #38bdf8;
      animation:blink 2s infinite alternate;
    }

    @keyframes blink{

      from{
        opacity:0.2;
      }

      to{
        opacity:1;
      }
    }

    /* TITLE */

    .title{
      text-align:center;
      margin-bottom:70px;
      position:relative;
      z-index:2;
    }

    .title h1{
      font-size:70px;
      color:#38bdf8;
      text-shadow:0 0 20px #38bdf8;
      margin-bottom:20px;
    }

    .title p{
      font-size:22px;
      color:#cbd5e1;
    }

    /* CONTACT CONTAINER */

    .contact-container{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:60px;
      position:relative;
      z-index:2;
    }

    /* LEFT SIDE */

    .contact-info{
      width:40%;
    }

    .contact-info h2{
      font-size:45px;
      margin-bottom:25px;
      color:#38bdf8;
    }

    .contact-info p{
      font-size:20px;
      line-height:35px;
      color:#cbd5e1;
      margin-bottom:40px;
    }

    /* INFO BOX */

    .info-box{
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
      background:rgba(255,255,255,0.05);
      padding:20px;
      border-radius:20px;
      transition:0.4s;
      backdrop-filter:blur(10px);
    }

    .info-box:hover{
      transform:translateX(10px);
      box-shadow:0 0 25px #38bdf8;
    }

    .info-box i{
      width:60px;
      height:60px;
      border-radius:50%;
      background:#38bdf8;
      color:black;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:25px;
    }

    .info-box h3{
      margin-bottom:5px;
      font-size:22px;
    }

    .info-box span{
      color:#cbd5e1;
      font-size:17px;
    }

    /* RIGHT FORM */

    .contact-form{
      width:55%;
      background:rgba(255,255,255,0.05);
      padding:40px;
      border-radius:30px;
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 25px rgba(0,0,0,0.2);
      animation:float 4s ease-in-out infinite;
    }

    .contact-form h2{
      font-size:40px;
      margin-bottom:30px;
      color:#38bdf8;
    }

    /* INPUTS */

    .input-box{
      margin-bottom:25px;
    }

    .input-box input,
    .input-box textarea{

      width:100%;
      padding:18px 20px;
      border:none;
      outline:none;
      border-radius:15px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:18px;
      border:1px solid rgba(255,255,255,0.1);
    }

    .input-box textarea{
      height:150px;
      resize:none;
    }

    .input-box input:focus,
    .input-box textarea:focus{

      border:1px solid #38bdf8;
      box-shadow:0 0 15px #38bdf8;
    }

    /* BUTTON */

    .btn{
      display:inline-block;
      padding:16px 40px;
      background:#38bdf8;
      color:black;
      text-decoration:none;
      border:none;
      border-radius:40px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.4s;
    }

    .btn:hover{
      transform:scale(1.08);
      box-shadow:0 0 25px #38bdf8;
    }

    /* SOCIAL ICONS */

    .social{
      margin-top:40px;
      display:flex;
      gap:20px;
    }

    .social a{
      width:60px;
      height:60px;
      border-radius:50%;
      border:2px solid #38bdf8;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#38bdf8;
      text-decoration:none;
      font-size:24px;
      transition:0.4s;
      box-shadow:0 0 15px #38bdf8;
    }

    .social a:hover{
      background:#38bdf8;
      color:black;
      transform:translateY(-8px);
    }

    /* FLOAT */

    @keyframes float{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-10px);
      }

      100%{
        transform:translateY(0px);
      }
    }

    /* RESPONSIVE */

    @media(max-width:1000px){

      .contact-container{
        flex-direction:column;
      }

      .contact-info,
      .contact-form{
        width:100%;
      }

      .title h1{
        font-size:45px;
      }

      .contact-info h2{
        font-size:35px;
      }

      .contact-form h2{
        font-size:32px;
      }
    }

  </style>

</head>

<body>

  <section class="contact-section">

    <!-- GLOW -->

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <!-- PARTICLES -->

    <div class="particles">

      <span style="top:10%;left:15%;"></span>
      <span style="top:20%;left:75%;"></span>
      <span style="top:35%;left:85%;"></span>
      <span style="top:55%;left:40%;"></span>
      <span style="top:70%;left:20%;"></span>
      <span style="top:85%;left:60%;"></span>

    </div>

    <!-- TITLE -->

    <div class="title">

      <h1>Contact Me</h1>

      <p>
        Let's connect and build something amazing together.
      </p>

    </div>

    <!-- CONTACT CONTAINER -->

    <div class="contact-container">

      <!-- LEFT -->

      <div class="contact-info">

        <h2>Get In Touch</h2>

        <p>
          Feel free to contact me for projects,
          collaborations or web development work.
        </p>

        <!-- EMAIL -->

        <div class="info-box">

          <i class="fas fa-envelope"></i>

          <div>

            <h3>Email</h3>

            <span>srilakshmi98@gmail.com</span>

          </div>

        </div>

        <!-- PHONE -->

        <div class="info-box">

          <i class="fas fa-phone"></i>

          <div>

            <h3>Phone</h3>

            <span>+91 7893652347</span>

          </div>

        </div>

        <!-- LOCATION -->

        <div class="info-box">

          <i class="fas fa-location-dot"></i>

          <div>

            <h3>Location</h3>

            <span>Guntur, Andhra Pradesh, India</span>

          </div>

        </div>

        <!-- SOCIAL -->

        <div class="social">

          <a href="#">
            <i class="fab fa-github"></i>
          </a>

          <a href="#">
            <i class="fab fa-linkedin"></i>
          </a>

          <a href="#">
            <i class="fab fa-instagram"></i>
          </a>

          <a href="#">
            <i class="fab fa-twitter"></i>
          </a>

        </div>

      </div>

      <!-- RIGHT -->

      <div class="contact-form">

        <h2>Send Message</h2>

        <form>

          <div class="input-box">

            <input type="text" placeholder="Your Name">

          </div>

          <div class="input-box">

            <input type="email" placeholder="Your Email">

          </div>

          <div class="input-box">

            <textarea placeholder="Write Your Message"></textarea>

          </div>

          <button class="btn">
            Send Message
          </button>

        </form>

      </div>

    </div>

  </section>

</body>
</html>
