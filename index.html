<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Portfolio</title>

  <!-- ICONS -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
      scroll-behavior:smooth;
    }

    body{
      background:#020617;
      overflow:hidden;
      color:white;
    }

    /* BACKGROUND */

    .background{
      position:fixed;
      width:100%;
      height:100vh;
      overflow:hidden;
      z-index:-1;
      background:linear-gradient(to right,#020617,#0f172a);
    }

    .circle{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      animation:move 10s infinite alternate;
    }

    .circle1{
      width:300px;
      height:300px;
      background:#00bfff;
      top:10%;
      left:10%;
    }

    .circle2{
      width:400px;
      height:400px;
      background:#7c3aed;
      bottom:10%;
      right:10%;
      animation-duration:14s;
    }

    .circle3{
      width:250px;
      height:250px;
      background:#38bdf8;
      top:50%;
      left:50%;
      animation-duration:12s;
    }

    @keyframes move{
      0%{
        transform:translate(0,0) scale(1);
      }

      100%{
        transform:translate(80px,-50px) scale(1.2);
      }
    }

    /* NAVBAR */

    nav{
      width:100%;
      height:80px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 8%;
      position:fixed;
      top:0;
      background:rgba(0,0,0,0.2);
      backdrop-filter:blur(10px);
      z-index:100;
    }

    .logo{
      font-size:40px;
      font-weight:bold;
      color:#38bdf8;
    }

    nav ul{
      display:flex;
      list-style:none;
      gap:35px;
    }

    nav ul li a{
      color:white;
      text-decoration:none;
      font-size:20px;
      transition:0.4s;
    }

    nav ul li a:hover{
      color:#38bdf8;
    }

    /* HERO SECTION */

    .hero{
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 8%;
    }

    .hero-text{
      width:50%;
    }

    .hero-text h1{
      font-size:80px;
      margin-bottom:20px;
      line-height:100px;
    }

    .hero-text span{
      color:#38bdf8;
    }

    .hero-text h2{
      font-size:45px;
      margin-bottom:20px;
    }

    .hero-text p{
      font-size:22px;
      color:#cbd5e1;
      line-height:40px;
      margin-bottom:35px;
    }

    /* BUTTONS */

    .buttons{
      display:flex;
      gap:25px;
      margin-bottom:35px;
    }

    .btn{
      padding:16px 40px;
      border-radius:40px;
      font-size:18px;
      text-decoration:none;
      transition:0.4s;
      font-weight:bold;
    }

    .btn1{
      background:#38bdf8;
      color:black;
    }

    .btn2{
      border:2px solid #38bdf8;
      color:#38bdf8;
    }

    .btn:hover{
      transform:scale(1.08);
      box-shadow:0 0 25px #38bdf8;
    }

    /* SOCIAL ICONS */

    .social-icons{
      display:flex;
      gap:20px;
    }

    .social-icons a{
      width:55px;
      height:55px;
      border:2px solid #38bdf8;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      color:#38bdf8;
      font-size:22px;
      transition:0.4s;
    }

    .social-icons a:hover{
      background:#38bdf8;
      color:black;
      transform:translateY(-8px);
      box-shadow:0 0 20px #38bdf8;
    }

    /* IMAGE */

    .hero-image{
      width:40%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .image-box{
      width:420px;
      height:420px;
      border-radius:50%;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      animation:float 4s ease-in-out infinite;
    }

    .image-box::before{
      content:'';
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background:conic-gradient(
      #38bdf8,
      #7c3aed,
      #00bfff,
      #38bdf8);
      animation:rotate 5s linear infinite;
      box-shadow:0 0 50px #38bdf8;
    }

    .image-box img{
      width:390px;
      height:390px;
      border-radius:50%;
      object-fit:cover;
      position:relative;
      z-index:2;
      border:6px solid #020617;
    }

    @keyframes rotate{
      100%{
        transform:rotate(360deg);
      }
    }

    @keyframes float{
      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-20px);
      }

      100%{
        transform:translateY(0px);
      }
    }

    /* PARTICLES */

    .particles span{
      position:absolute;
      width:4px;
      height:4px;
      background:white;
      border-radius:50%;
      animation:particles 10s linear infinite;
      opacity:0.7;
    }

    .particles span:nth-child(1){
      left:10%;
      animation-duration:8s;
      top:100%;
    }

    .particles span:nth-child(2){
      left:30%;
      animation-duration:12s;
      top:100%;
    }

    .particles span:nth-child(3){
      left:50%;
      animation-duration:10s;
      top:100%;
    }

    .particles span:nth-child(4){
      left:70%;
      animation-duration:14s;
      top:100%;
    }

    .particles span:nth-child(5){
      left:90%;
      animation-duration:9s;
      top:100%;
    }

    @keyframes particles{
      0%{
        transform:translateY(0);
        opacity:0;
      }

      50%{
        opacity:1;
      }

      100%{
        transform:translateY(-120vh);
        opacity:0;
      }
    }

    /* RESPONSIVE */

    @media(max-width:1000px){

      .hero{
        flex-direction:column-reverse;
        justify-content:center;
        text-align:center;
        padding-top:120px;
      }

      .hero-text{
        width:100%;
      }

      .hero-image{
        width:100%;
        margin-bottom:40px;
      }

      .hero-text h1{
        font-size:55px;
        line-height:70px;
      }

      .hero-text h2{
        font-size:30px;
      }

      nav{
        flex-direction:column;
        height:auto;
        padding:20px;
      }

      nav ul{
        margin-top:15px;
      }

      .image-box{
        width:300px;
        height:300px;
      }

      .image-box img{
        width:270px;
        height:270px;
      }
    }

  </style>
</head>
<body>

  <!-- ANIMATED BACKGROUND -->

  <div class="background">

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="particles">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

  <!-- NAVBAR -->

  <nav>

    <div class="logo">Arthimalla Sri Lakshmi</div>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contactme.html">Contact</a></li>
    </ul>

  </nav>

  <!-- HERO SECTION -->

  <section class="hero">

    <div class="hero-text">

      <h1>
        Hi, I'm <span>Sri Lakshmi</span>
      </h1>

      <h2>
        Python Developer & Web Designer
      </h2>

      <p>
        I create stylish, modern and interactive websites with beautiful UI animations and responsive designs.
      </p>

      <div class="buttons">

        <a href="#" class="btn btn1">
          Hire Me
        </a>

        <a href="#" class="btn btn2">
          Download Resume
        </a>

      </div>

      <div class="social-icons">

        <a href="#">
          <i class="fab fa-github"></i>
        </a>

        <a href="#">
          <i class="fab fa-linkedin"></i>
        </a>

        <a href="#">
          <i class="fab fa-instagram"></i>
        </a>

        <a href="#">
          <i class="fas fa-envelope"></i>
        </a>

      </div>

    </div>

    <!-- IMAGE -->

    <div class="hero-image">

      <div class="image-box">

        <img src="images/pic1.jpeg">

      </div>

    </div>

  </section>

</body>
</html>
